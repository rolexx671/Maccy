---
name: 🐛 Сообщение об ошибке
description: Сообщить об ошибке
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время заполнить сообщение об ошибке!
        Так причину проблемы найти быстрее, а уточняющих вопросов будет меньше.
  - type: checkboxes
    attributes:
      label: Перед отправкой сообщения об ошибке
      options:
        - label: Я проверил(а), что такого сообщения ещё нет, чтобы не создавать дубликат.
          required: false
        - label: Я прочитал(а) [FAQ](https://github.com/p0deje/Maccy?tab=readme-ov-file#faq).
          required: false
  - type: input
    attributes:
      label: Версия Maccy (смотрите в окне «О приложении»)
      placeholder: например, 0.29.0
    validations:
      required: false
  - type: input
    attributes:
      label: Версия macOS
      placeholder: например, 13.5.2
    validations:
      required: false
  - type: textarea
    attributes:
      label: Настройки Maccy
      description: Приложите вывод команды 'defaults read org.p0deje.Maccy', выполненной в Terminal.app.
      render: Shell
    validations:
      required: false
  - type: textarea
    attributes:
      label: Описание
      description: Опишите ошибку чётко и коротко.
      placeholder: Краткое описание
    validations:
      required: false
  - type: textarea
    attributes:
      label: Шаги для воспроизведения
      description: |
        Опишите шаги, при которых проблема воспроизводится каждый раз. По возможности запишите
        видео экрана через QuickTime.app, на котором видна проблема.
      placeholder: |
        1. Перейдите в …
        2. Нажмите на …
        3. Прокрутите вниз до …
        4. Посмотрите на …
    validations:
      required: false
