---
name: 💪 Запрос новой функции
description: Предложить идею для проекта
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Перед отправкой запроса новой функции
      options:
        - label: Я проверил(а), что похожего запроса ещё нет, чтобы не создавать дубликат.
          required: false
        - label: Я прочитал(а) [FAQ](https://github.com/p0deje/Maccy?tab=readme-ov-file#faq).
          required: false
  - type: textarea
    attributes:
      label: Проблема
      description:
        Опишите чётко и коротко проблему, которую вы хотите
        решить с помощью этой функции.
      placeholder: |
        Описание
  - type: textarea
    attributes:
      label: Решение
      description: Опишите, как, по-вашему, можно решить эту проблему. Если нужно, добавьте скриншот, gif или видео, чтобы лучше показать идею.
      placeholder: |
        Краткое описание
    validations:
      required: false
